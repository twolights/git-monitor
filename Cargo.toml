[package]
name = "git-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A read-only terminal UI to watch git repository status in real time"
license = "MIT"

[lib]
name = "git_monitor"
path = "src/lib.rs"

[[bin]]
name = "git-monitor"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
git2 = "0.20"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
