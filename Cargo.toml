[package]
name = "git-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A read-only terminal UI to watch git repository status in real time"
license = "MIT"

[lib]
name = "git_monitor"
path = "src/lib.rs"

[[bin]]
name = "git-monitor"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
# Read-only local repo access only — disable default features (ssh/https) so we
# don't drag in openssl-sys, which breaks cross-compilation and needs system
# libssl. libgit2 is still built (bundled) for status/branch/commit reads.
git2 = { version = "0.20", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Must match the versions ratatui uses internally so our column math agrees
# with how ratatui actually measures and draws spans: it iterates *graphemes*
# (unicode-segmentation) and measures each with unicode-width.
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"
